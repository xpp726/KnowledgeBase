# 知识库基础设施：Milvus 向量库 + BGE-M3 向量化服务
#
# 启动：docker compose up -d
# 停止：docker compose down
# 查看：docker compose ps
#
# 端口占用：19530(Milvus gRPC) 9091(Milvus REST) 9000/9001(MinIO) 8003(Embedding)

services:
  # ---------- Milvus 依赖：元数据存储 ----------
  etcd:
    container_name: kb-etcd
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------- Milvus 依赖：对象存储 ----------
  minio:
    container_name: kb-minio
    image: minio/minio:RELEASE.2023-12-20T01-00-02Z
    restart: unless-stopped
    environment:
      # 用新变量名：旧的 MINIO_ACCESS_KEY/MINIO_SECRET_KEY 自 2021-04 起已弃用，随时可能被移除
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    # 该镜像内没有 curl/wget，只能用自带的 mc 探活
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------- Milvus 主服务（支持 dense + sparse 混合检索）----------
  milvus:
    container_name: kb-milvus
    image: milvusdb/milvus:v2.5.27
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # ---------- BGE-M3 向量化服务（GPU，dense + sparse 双输出）----------
  bge-m3:
    container_name: kb-bge-m3
    restart: unless-stopped
    build:
      context: ./embed
    image: kb-bge-m3:latest
    environment:
      MODEL_NAME: BAAI/bge-m3
      MAX_TEXTS: "256"
      DEFAULT_BATCH: "32"
      USE_FP16: "true"
      HF_ENDPOINT: https://hf-mirror.com
      # 强制离线：烘焙的权重已在镜像内，禁止任何联网校验，
      # 否则镜像里没有的隐藏文件（如 imgs/.DS_Store）会让 hf-mirror 返回 403
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports:
      - "8003:8003"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5

  # ---------- Milvus 可视化管理界面（可选）----------
  attu:
    container_name: kb-attu
    image: zilliz/attu:v2.5
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3000:3000"
    depends_on:
      - milvus
    profiles:
      - tools

volumes:
  etcd-data:
  minio-data:
  milvus-data: